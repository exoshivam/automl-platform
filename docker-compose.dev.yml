# Dev infrastructure only. The API (8010) and Celery workers run natively on the host (uv venv, Python 3.12).
# Ports are fixed to avoid clashes with other local projects. Everything binds to 127.0.0.1.
#   docker compose -f docker-compose.dev.yml up -d
name: automl-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: automl
      POSTGRES_PASSWORD: automl
      POSTGRES_DB: automl
    ports: ["127.0.0.1:5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automl -d automl"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6381:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # minio/minio is no longer pullable from Docker Hub; this pinned Bitnami build is dev-only (frozen, no updates).
  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: automl
      MINIO_ROOT_PASSWORD: automl-dev-secret
      MINIO_DEFAULT_BUCKETS: automl-data,automl-mlflow
      # Lets the browser PUT presigned parts straight to MinIO from the dev frontend.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev MLflow: SQLite backend + locally served artefacts (the stock image has no psycopg2/boto3).
  # Production uses the Postgres backend + S3 artefacts (PRD §8.4).
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
    ports: ["127.0.0.1:5005:5000"]
    volumes: [mlflowdata:/mlflow]

volumes:
  pgdata:
  redisdata:
  miniodata:
  mlflowdata:
