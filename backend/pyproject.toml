[project]
name = "automl-backend"
version = "0.1.0"
description = "AutoML platform API and workers (PRD v0.2)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "redis>=5.2",
  "celery[redis]>=5.4",
  "boto3>=1.35",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "authlib>=1.3",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "structlog>=24.4",
  "python-multipart>=0.0.17",
  "pillow>=11.0",
  "imagehash>=4.3",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyarrow>=18.0",
  "scikit-learn>=1.5",
  "datasketch>=1.6",
  "anthropic>=1.0",
  "pillow-heif>=0.20",
  "torch>=2.5",
  "torchvision>=0.20",
  "timm>=1.0",
  "transformers>=4.46",
  "optuna>=4.1",
  "lightgbm>=4.5",
  "mlflow-skinny>=2.17",
  "psutil>=6.1",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript>=0.1",
  "onnxmltools>=1.13",
  "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
